[install]
# Always resolve from the public npm registry. The @lovable.dev/* packages are
# published there too, so this keeps `bun install --frozen-lockfile` working on
# any network (e.g. the Goplex server / IT build). Without this, a lockfile
# regenerated inside Lovable's sandbox can pin tarball URLs to Lovable's private
# mirror (europe-west4-npm.pkg.dev/lovable-core-prod), which 403s off-network.
registry = "https://registry.npmjs.org"
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/vite-plugin-dev-server-bridge", "@lovable.dev/vite-plugin-hmr-gate"]
